name: Check and Deploy Portable React Project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check whitespace and patch hygiene
        run: git diff --check $(git hash-object -t tree /dev/null) HEAD

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Build production bundle (root /)
        env:
          VITE_DATA_SOURCE: demo
        run: npm run build

      - name: Build production bundle (GitHub Pages subpath + SPA 404 fallback)
        env:
          VITE_DATA_SOURCE: demo
          VITE_BASE_PATH: /dooks-meatlovers/
        run: |
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish dist to gh-pages branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
