<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dooks responsive validation</title>
<style>body{margin:0;background:#d9d7ce;color:#253022;font:14px Arial,sans-serif}header{padding:14px 20px;display:flex;gap:15px;align-items:center;background:#253022;color:white}select,a{padding:10px;color:inherit}select{color:#253022}main{padding:24px;overflow:auto}iframe{border:0;display:block;background:#f6f1e7;box-shadow:0 4px 30px #0003}p{margin:0;font-size:12px}</style></head>
<body><header><strong>Responsive validation</strong><label>Viewport <select id="size"><option value="360">Mobile · 360px</option><option value="390">Mobile · 390px</option><option value="768">Tablet · 768px</option><option value="1366">Desktop · 1366px</option></select></label><a href="/">Open site</a></header><main><iframe title="Site viewport" id="site" src="/" width="360" height="800"></iframe></main>
<script>const frame=document.getElementById('site'); document.getElementById('size').addEventListener('change',event=>frame.width=event.target.value);</script></body></html>
